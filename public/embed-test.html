<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>助手嵌入测试</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    *, *::before, *::after { box-sizing: border-box; }
    html { width: 100%; min-width: 0; }
    body { width: min(100%, 640px); max-width: 100vw; min-width: 0; margin: auto; padding: 24px 20px 120px; overflow-wrap: anywhere; }
    form { width: 100%; min-width: 0; }
    h1 { font-size: 24px; }
    label { display: block; margin: 18px 0 6px; }
    input:not([type=checkbox]), button { display: block; width: 100%; min-width: 0; max-width: 100%; padding: 12px; font: inherit; font-size: 16px; border: 1px solid GrayText; border-radius: 8px; }
    input[type=checkbox] { width: 20px; height: 20px; vertical-align: middle; }
    button { margin-top: 14px; cursor: pointer; }
    p, small { line-height: 1.7; }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>助手嵌入测试</h1>
  <small id="viewport-info">适配版本 3</small>
  <p>填写发布渠道使用的用户 Token，加载后点击右下角 AI 按钮。Token 仅保留在当前页面内存中，不写入此测试页的存储。</p>
  <form id="settings">
    <label for="origin">助手服务地址</label>
    <input id="origin" type="url" required autocomplete="off">
    <label for="token">用户登录 Token（不是 API Key）</label>
    <input id="token" type="password" required autocomplete="off" placeholder="粘贴有效的用户登录 Token">
    <label for="appId">App ID（可选）</label>
    <input id="appId" autocomplete="off" placeholder="留空可在助手里选择智能体">
    <label><input id="camera" type="checkbox" checked> 启用移动端拍照</label>
    <label><input id="auto" type="checkbox"> 自动打开对话窗口</label>
    <button type="submit">加载 / 重新加载助手</button>
  </form>
  <button id="unload" type="button">卸载助手</button>
  <button id="count" type="button">宿主页面点击测试：0</button>
  <p id="status" role="status" aria-live="polite">尚未加载助手</p>
  <small>拍照入口还要求所选智能体开启文件上传并允许图片。本页通过 HTTP 访问，若手机浏览器限制相机能力，需要在 HTTPS 环境复测。嵌入助手自身仍沿用项目现有登录存储逻辑。</small>
  <script>
    const field = (id) => document.getElementById(id);
    function showViewportInfo() {
      const visual = window.visualViewport;
      field('viewport-info').textContent = `适配版本 3 · 布局 ${document.documentElement.clientWidth}px / 可见 ${Math.round(visual?.width ?? innerWidth)}px / 页面 ${document.documentElement.scrollWidth}px / 缩放 ${Number(visual?.scale ?? 1).toFixed(2)}`;
    }
    showViewportInfo();
    window.addEventListener('resize', showViewportInfo);
    window.visualViewport?.addEventListener('resize', showViewportInfo);
    field('origin').value = location.origin;
    let launcher = null;
    let count = 0;
    function unload() {
      if (launcher) {
        launcher.dispatchEvent(new Event('assistant:destroy'));
        launcher.remove();
        launcher = null;
      }
    }
    field('settings').addEventListener('submit', (event) => {
      event.preventDefault();
      const token = field('token').value.trim();
      if (!token) { field('status').textContent = '请填写有效的用户 Token'; return; }
      let origin;
      try {
        const url = new URL(field('origin').value);
        if (!['http:', 'https:'].includes(url.protocol)) throw new Error();
        origin = url.origin;
      } catch { field('status').textContent = '请填写 http:// 或 https:// 开头的服务地址'; return; }
      unload();
      const params = new URLSearchParams({ token, mode: 'page' });
      const appId = field('appId').value.trim();
      if (appId) params.set('appId', appId);
      if (field('camera').checked) params.set('capture', '1');
      launcher = document.createElement('script');
      launcher.src = origin + '/assistant-embed.js';
      launcher.dataset.src = origin + '/embed/assistant?' + params;
      launcher.dataset.open = String(field('auto').checked);
      launcher.dataset.width = '420';
      launcher.dataset.height = '640';
      launcher.dataset.primary = '#4169a4';
      launcher.dataset.primaryForeground = '#ffffff';
      launcher.addEventListener('load', () => { field('status').textContent = '启动脚本已加载，可以打开助手'; });
      launcher.addEventListener('error', () => { field('status').textContent = '启动脚本加载失败，请检查服务地址和网络'; });
      document.body.append(launcher);
    });
    field('unload').addEventListener('click', () => { unload(); field('status').textContent = '助手已卸载'; });
    field('count').addEventListener('click', () => { field('count').textContent = '宿主页面点击测试：' + (++count); });
    window.addEventListener('pagehide', unload);
  </script>
</body>
</html>
